<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .search-container {
            background: white;
            border-radius: 12px;
            padding: 8px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 1000px;
            width: 100%;
        }

        .search-form {
            display: flex;
            align-items: center;
            gap: 2px;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

        .input-group {
            flex: 1;
            position: relative;
            border-right: 1px solid #e5e7eb;
            min-height: 60px;
            display: flex;
            align-items: center;
            padding: 0 16px;
        }

        .input-group:last-of-type {
            border-right: none;
        }

        .input-group .icon {
            margin-right: 12px;
            color: #6b7280;
            font-size: 18px;
        }

        .input-group input {
            border: none;
            outline: none;
            font-size: 14px;
            color: #374151;
            background: transparent;
            width: 100%;
        }

        .input-group input::placeholder {
            color: #9ca3af;
        }

        .dates-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #374151;
        }

        .date-separator {
            color: #6b7280;
            font-weight: 500;
        }

        .guests-dropdown {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #374151;
            cursor: pointer;
        }

        .dropdown-arrow {
            color: #6b7280;
            font-size: 12px;
        }

        .search-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 0 32px;
            height: 60px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: background-color 0.2s;
        }

        .search-btn:hover {
            background: #1d4ed8;
        }

        .flight-checkbox {
            margin-top: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .flight-checkbox input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #2563eb;
        }

        .flight-checkbox label {
            font-size: 14px;
            color: #374151;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .search-form {
                flex-direction: column;
            }
            
            .input-group {
                border-right: none;
                border-bottom: 1px solid #e5e7eb;
                width: 100%;
            }
            
            .input-group:last-of-type {
                border-bottom: none;
            }
        }
    </style>
</head>
<body>
    <div class="search-container">
        <div class="search-form">
            <div class="input-group">
                <span class="icon">🚌</span>
                <input type="text" placeholder="Where are you going?" />
            </div>
            
            <div class="input-group">
                <span class="icon">📅</span>
                <div class="dates-group">
                    <span>Check-in date</span>
                    <span class="date-separator">—</span>
                    <span>Check-out date</span>
                </div>
            </div>
            
            <div class="input-group">
                <span class="icon">👤</span>
                <div class="guests-dropdown">
                    <span>2 adults · 0 children · 1 room</span>
                    <span class="dropdown-arrow">▼</span>
                </div>
            </div>
            
            <button class="search-btn">Search</button>
        </div>
        
        <div class="flight-checkbox">
            <input type="checkbox" id="flights" />
            <label for="flights">I'm looking for flights</label>
        </div>
    </div>

    <script>
        // Add click handlers for interactive elements
        document.querySelector('.guests-dropdown').addEventListener('click', function() {
            alert('Guest selection dropdown would open here');
        });

        document.querySelector('.dates-group').addEventListener('click', function() {
            alert('Date picker would open here');
        });

        document.querySelector('.search-btn').addEventListener('click', function() {
            const destination = document.querySelector('input[placeholder="Where are you going?"]').value;
            const includeFlights = document.querySelector('#flights').checked;
            
            if (destination.trim() === '') {
                alert('Please enter a destination');
                return;
            }
            
            alert(`Searching for: ${destination}${includeFlights ? ' (including flights)' : ''}`);
        });
    </script>
</body>
</html>
